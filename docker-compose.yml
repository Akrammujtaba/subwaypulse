# SubwayPulse local stack.
#
#   Live MTA feeds:      docker compose up -d --build
#   Simulator instead:   docker compose -f docker-compose.yml -f docker-compose.sim.yml up -d --build
#   Score a sim run:     docker compose -f docker-compose.yml -f docker-compose.sim.yml run --rm evaluator
#   Stop (keep data):    docker compose down        Wipe everything: docker compose down -v
name: subwaypulse

x-lake-env: &lake-env
  TZ: UTC
  KAFKA_BOOTSTRAP: kafka:9092
  SCHEMA_REGISTRY_URL: http://schema-registry:8085
  ICEBERG_CATALOG: lake
  ICEBERG_JDBC_URI: jdbc:postgresql://postgres:5432/iceberg
  ICEBERG_JDBC_USER: subway
  ICEBERG_JDBC_PASSWORD: subway
  ICEBERG_WAREHOUSE: s3://lake/warehouse
  S3_ENDPOINT: http://s3:8333
  AWS_ACCESS_KEY_ID: subwaypulse
  AWS_SECRET_ACCESS_KEY: subwaypulse-secret
  AWS_REGION: us-east-1
  REF_DSN: postgresql://subway:subway@postgres:5432/subway

x-flink-conf: &flink-conf
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: 2
    parallelism.default: 2
    taskmanager.memory.process.size: 1600m
    jobmanager.memory.process.size: 1024m
    state.backend.type: hashmap
    state.checkpoints.dir: s3://lake/checkpoints
    s3.endpoint: http://s3:8333
    s3.path.style.access: true
    s3.access-key: subwaypulse
    s3.secret-key: subwaypulse-secret
    restart-strategy.type: exponential-delay
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249

services:
  # ---------- storage and catalog ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: subway
      POSTGRES_PASSWORD: subway
      POSTGRES_DB: subway
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subway -d subway"]
      interval: 5s
      retries: 20

  # S3-compatible object storage for Iceberg, the raw archive, and Flink checkpoints.
  s3:
    image: chrislusf/seaweedfs:4.28
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333",
              "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    ports: ["8333:8333", "8888:8888"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  s3-init:
    image: amazon/aws-cli:2.38.4
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: subwaypulse
      AWS_SECRET_ACCESS_KEY: subwaypulse-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        aws configure set default.s3.addressing_style path
        for i in $$(seq 1 90); do
          aws --endpoint-url http://s3:8333 s3api head-bucket --bucket lake 2>/dev/null && echo "bucket ready" && exit 0
          aws --endpoint-url http://s3:8333 s3 mb s3://lake 2>/dev/null && echo "bucket created" && exit 0
          sleep 2
        done
        echo "S3 never became ready" && exit 1
    restart: "no"

  # ---------- streaming ----------
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: Qm2pS0dWUmF5LXN1YndheQ
    ports: ["29092:29092"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        k=/opt/kafka/bin/kafka-topics.sh
        $$k --bootstrap-server kafka:9092 --create --if-not-exists --topic subway.trip_events \
            --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config compression.type=zstd
        $$k --bootstrap-server kafka:9092 --create --if-not-exists --topic schedule.headways \
            --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        $$k --bootstrap-server kafka:9092 --create --if-not-exists --topic subway.incidents \
            --partitions 1 --replication-factor 1
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports: ["8085:8085"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/subjects > /dev/null"]
      interval: 10s
      retries: 30

  # ---------- reference data ----------
  # Downloads the static schedule and publishes scheduled headways for today and tomorrow.
  # Airflow refreshes it every morning; this runs it once at startup.
  schedule-loader:
    build: {context: ., dockerfile: infra/python/Dockerfile}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    environment:
      <<: *lake-env
      GTFS_URL: ${GTFS_URL:-https://rrgtfsfeeds.s3.amazonaws.com/gtfs_supplemented.zip}
      GTFS_CACHE: /data/gtfs.zip
      SCHEDULE_START_DATE: ${SCHEDULE_START_DATE:-today}
      SCHEDULE_DAYS: "2"
    volumes: [gtfs:/data]
    command: ["python", "-m", "subwaypulse.load_schedule"]
    restart: "no"

  # ---------- processing ----------
  jobmanager:
    build: {context: ., dockerfile: infra/flink/Dockerfile}
    depends_on:
      schedule-loader: {condition: service_completed_successfully}
      schema-registry: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    environment:
      <<: [*lake-env, *flink-conf]
      OUT_OF_ORDER_SECONDS: ${OUT_OF_ORDER_SECONDS:-45}
      RELEASE_DELAY_SECONDS: ${RELEASE_DELAY_SECONDS:-60}
      CHECKPOINT_SECONDS: ${CHECKPOINT_SECONDS:-30}
    command: ["standalone-job", "--job-classname", "io.subwaypulse.SubwayPulseJob"]
    ports: ["8082:8081"]
    restart: unless-stopped

  taskmanager:
    build: {context: ., dockerfile: infra/flink/Dockerfile}
    depends_on: [jobmanager]
    environment:
      <<: [*lake-env, *flink-conf]
    command: ["taskmanager"]
    restart: unless-stopped

  # ---------- ingestion ----------
  collector:
    build: {context: ., dockerfile: infra/python/Dockerfile}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      schema-registry: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    environment:
      <<: *lake-env
      FEED_BASE_URL: ${FEED_BASE_URL:-https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds}
      FEEDS: ${FEEDS:-}
      POLL_SECONDS: ${POLL_SECONDS:-15}
      ARCHIVE_BUCKET: lake
      ARCHIVE_FLUSH_SECONDS: "300"
    command: ["python", "-m", "subwaypulse.collector"]
    ports: ["8000:8000"]
    restart: unless-stopped

  # ---------- serving ----------
  trino:
    image: trinodb/trino:455
    depends_on:
      postgres: {condition: service_healthy}
      s3-init: {condition: service_completed_successfully}
    ports: ["8080:8080"]
    volumes:
      - ./infra/trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
      - ./infra/trino/catalog/ref.properties:/etc/trino/catalog/ref.properties:ro

  # ---------- orchestration ----------
  airflow:
    build: {context: ., dockerfile: infra/airflow/Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
      trino: {condition: service_started}
    environment:
      <<: *lake-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://subway:subway@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: subwaypulse-local-only
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      GTFS_URL: ${GTFS_URL:-https://rrgtfsfeeds.s3.amazonaws.com/gtfs_supplemented.zip}
      GTFS_CACHE: /data/gtfs.zip
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
        (airflow scheduler &) &&
        exec airflow webserver
    ports: ["8081:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./subwaypulse:/opt/subwaypulse/subwaypulse:ro
      - ./dbt:/opt/dbt:ro
      - gtfs:/data

  # ---------- observability ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/subwaypulse.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  pgdata:
  kafkadata:
  s3data:
  gtfs:
  promdata:
