connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=subway
iceberg.jdbc-catalog.connection-password=subway
iceberg.jdbc-catalog.default-warehouse-dir=s3://lake/warehouse
fs.native-s3.enabled=true
s3.endpoint=http://s3:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=subwaypulse
s3.aws-secret-key=subwaypulse-secret
# Let hourly maintenance expire snapshots and clean orphans younger than the 7-day default.
iceberg.expire-snapshots.min-retention=1h
iceberg.remove-orphan-files.min-retention=1h
